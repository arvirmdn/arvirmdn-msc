# File ini dibaca otomatis oleh Railway (pakai Nixpacks sebagai builder).
#
# "ffmpeg" WAJIB ada di sini karena kita download audio dari YouTube
# lalu convert ke MP3 pakai FFmpegExtractAudio (postprocessor yt-dlp).
# Tanpa ffmpeg, audio tidak bisa di-convert ke format MP3.
#
# "deno" juga tetap diperlukan untuk yt-dlp.
#
# "..." wajib ada supaya paket Python bawaan tetap terpasang.
[phases.setup]
nixPkgs = ["...", "deno", "ffmpeg"]
