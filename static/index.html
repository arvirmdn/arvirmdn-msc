<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Musikin — Cari & Putar Musik</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">🎵 Musikin</div>
      <nav>
        <a href="#" class="nav-item active" data-view="search">🔍 Cari</a>
        <a href="#" class="nav-item" data-view="library">📚 Riwayat</a>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="search-box">
          <input id="searchInput" type="text" placeholder="Mau dengerin lagu apa hari ini?" autocomplete="off">
          <button id="searchBtn" aria-label="Cari">🔍</button>
        </div>
      </header>

      <section id="searchView" class="view active">
        <div id="status" class="status"></div>
        <ul id="resultList" class="track-list"></ul>
      </section>

      <section id="libraryView" class="view">
        <h2 class="section-title">Riwayat Diputar</h2>
        <ul id="historyList" class="track-list"></ul>
      </section>
    </main>
  </div>

  <footer class="player-bar">
    <div class="player-track">
      <img id="playerThumb" class="player-thumb" src="" alt="">
      <div class="player-meta">
        <div id="playerTitle" class="player-title">Belum ada lagu diputar</div>
        <div id="playerArtist" class="player-artist">—</div>
      </div>
    </div>

    <div class="player-controls">
      <div class="control-buttons">
        <button id="prevBtn" title="Sebelumnya">⏮</button>
        <button id="playBtn" title="Putar/Jeda">▶</button>
        <button id="nextBtn" title="Berikutnya">⏭</button>
      </div>
      <div class="progress-row">
        <span id="curTime">0:00</span>
        <input id="seekBar" type="range" min="0" max="100" value="0" step="0.1">
        <span id="durTime">0:00</span>
      </div>
    </div>

    <div class="player-volume">
      <span>🔊</span>
      <input id="volumeBar" type="range" min="0" max="100" value="80">
    </div>
  </footer>

  <audio id="audioPlayer" preload="none"></audio>

  <script src="app.js"></script>
</body>
</html>
