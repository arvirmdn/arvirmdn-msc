<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<title>Musikin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <!-- ===== HOME / SEARCH SCREEN ===== -->
    <main class="screen" id="mainScreen">
      <header class="topbar">
        <span class="brand">Musikin</span>
      </header>

      <div class="search-wrap">
        <div class="search-pill">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm10 2-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <input id="searchInput" type="text" inputmode="search" placeholder="Cari judul lagu atau artis" autocomplete="off">
        </div>
      </div>

      <div id="statusRow" class="status-row"></div>

      <section id="searchView" class="panel active">
        <ul id="resultList" class="track-list"></ul>
        <div id="emptyState" class="empty-state">
          <div class="empty-eq">
            <span></span><span></span><span></span><span></span>
          </div>
          <p>Ketik nama lagu buat mulai nyari di YouTube</p>
        </div>
      </section>

      <section id="libraryView" class="panel">
        <h2 class="panel-title">Baru diputar</h2>
        <ul id="historyList" class="track-list"></ul>
      </section>
    </main>

    <!-- ===== MINI PLAYER ===== -->
    <button class="mini-player" id="miniPlayer" aria-label="Buka player">
      <img id="miniThumb" class="mini-thumb" src="" alt="">
      <div class="mini-meta">
        <span id="miniTitle" class="mini-title">Belum ada lagu</span>
        <span id="miniArtist" class="mini-artist">Cari lagu buat mulai</span>
      </div>
      <div class="mini-eq" id="miniEq"><span></span><span></span><span></span></div>
      <span class="mini-playpause" id="miniPlayPause">
        <svg id="miniPlayIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7L8 5Z"/></svg>
        <svg id="miniPauseIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 5h4v14H7V5Zm6 0h4v14h-4V5Z"/></svg>
      </span>
    </button>

    <!-- ===== BOTTOM NAV ===== -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-view="searchView">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm10 2-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Cari</span>
      </button>
      <button class="nav-btn" data-view="libraryView">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="4" rx="1" stroke="currentColor" stroke-width="2"/><rect x="3" y="11" width="18" height="4" rx="1" stroke="currentColor" stroke-width="2"/><rect x="3" y="18" width="12" height="2.5" rx="1" stroke="currentColor" stroke-width="2"/></svg>
        <span>Riwayat</span>
      </button>
    </nav>

  </div>

  <!-- ===== FULL PLAYER SHEET ===== -->
  <div class="player-sheet" id="playerSheet">
    <div class="sheet-handle-area" id="sheetHandle">
      <div class="sheet-handle"></div>
    </div>

    <div class="sheet-content">
      <div class="art-wrap">
        <img id="sheetThumb" class="art" src="" alt="">
      </div>

      <div class="sheet-meta">
        <div>
          <h1 id="sheetTitle" class="sheet-title">Belum ada lagu</h1>
          <p id="sheetArtist" class="sheet-artist">—</p>
        </div>
      </div>

      <div class="progress-wrap">
        <input id="seekBar" class="seek" type="range" min="0" max="100" value="0" step="0.1">
        <div class="time-row">
          <span id="curTime">0:00</span>
          <span id="durTime">0:00</span>
        </div>
      </div>

      <div class="controls-row">
        <button id="prevBtn" class="ctrl-btn" aria-label="Sebelumnya">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6V5Zm3.5 7 10-7v14l-10-7Z"/></svg>
        </button>
        <button id="playBtn" class="ctrl-btn play" aria-label="Putar/Jeda">
          <svg id="playIcon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7L8 5Z"/></svg>
          <svg id="pauseIcon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 5h4v14H7V5Zm6 0h4v14h-4V5Z"/></svg>
        </button>
        <button id="nextBtn" class="ctrl-btn" aria-label="Berikutnya">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2V5ZM4.5 5l10 7-10 7V5Z"/></svg>
        </button>
      </div>

      <div class="volume-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 5V4L8 9H4Z"/></svg>
        <input id="volumeBar" class="volume" type="range" min="0" max="100" value="80">
      </div>
    </div>
  </div>

  <audio id="audioPlayer" preload="none"></audio>

  <script src="app.js"></script>
</body>
</html>
