<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d2025"/>
      <stop offset="1" stop-color="#0b0c0f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="40" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34e5a1"/>
      <stop offset="1" stop-color="#7dffce"/>
    </linearGradient>
    <style>
      .b { transform-box: fill-box; transform-origin: bottom; animation: p 1.1s ease-in-out infinite; }
      .b:nth-child(1) { animation-delay: 0s; }
      .b:nth-child(2) { animation-delay: .18s; }
      .b:nth-child(3) { animation-delay: .36s; }
      .b:nth-child(4) { animation-delay: .54s; }
      @keyframes p { 0%, 100% { transform: scaleY(.55); } 50% { transform: scaleY(1); } }
    </style>
  </defs>
  <rect x="0.75" y="0.75" width="38.5" height="38.5" rx="11" fill="url(#bg)" stroke="#34e5a1" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect class="b" x="9" y="20" width="3.6" height="11" rx="1.8" fill="url(#bar)"/>
  <rect class="b" x="15.6" y="14" width="3.6" height="17" rx="1.8" fill="url(#bar)"/>
  <rect class="b" x="22.2" y="8" width="3.6" height="23" rx="1.8" fill="#f4f5f7"/>
  <rect class="b" x="28.8" y="14" width="3.6" height="17" rx="1.8" fill="url(#bar)"/>
  <circle cx="31" cy="31" r="7" fill="#34e5a1"/>
  <path d="M29 28.2 35 31 29 33.8Z" fill="#06130d"/>
</svg>
